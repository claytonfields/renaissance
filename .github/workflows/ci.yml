name: CI

on:
  push:
    branches: [renaissance-1.2, develop]
  pull_request:
    branches: [renaissance-1.2, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install CPU-only PyTorch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: |
          pip install -r requirements.txt
          pip install -e .
          pip install pytest
      - name: Run tests
        run: pytest tests/

  test-v2:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install v2 package
        run: pip install -e "./v2[dev]"
      - name: Run v2 tests
        working-directory: v2 # rootdir=v2 so pytest reads v2/pyproject.toml, not root pytest.ini
        run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install ruff
      - run: ruff check .
